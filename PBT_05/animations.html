<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations Demo</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>Luxury Products</h1>
    </header>

    <!-- LOADING SPINNER -->
    <section class="loading-section">
        <div class="spinner"></div>
        <p>Loading products...</p>
    </section>

    <!-- PRODUCT GRID -->
    <section class="products">

        <!-- CARD 1 -->
        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/220?1" alt="Product">
            </div>

            <div class="card-content">
                <h3>Luxury Watch</h3>
                <p>$120</p>
                <button>Mua ngay</button>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/220?2" alt="Product">
            </div>

            <div class="card-content">
                <h3>Modern Shoes</h3>
                <p>$85</p>
                <button>Mua ngay</button>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/220?3" alt="Product">
            </div>

            <div class="card-content">
                <h3>Premium Jacket</h3>
                <p>$150</p>
                <button>Mua ngay</button>
            </div>
        </div>

        <!-- CARD 4 -->
        <div class="card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/220?4" alt="Product">
            </div>

            <div class="card-content">
                <h3>Gaming Headset</h3>
                <p>$95</p>
                <button>Mua ngay</button>
            </div>
        </div>

    </section>

</body>
</html>
