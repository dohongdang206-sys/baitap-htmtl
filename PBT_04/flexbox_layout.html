<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="flexbox_layout.css">
</head>
<body>  
    <header class="navbar">

        <!-- Logo bên trái -->
        <div class="logo">
            LOGO
        </div>
        <div>
            <h2>xinChao</h2>
        </div>

        <!-- Menu nằm giữa -->
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>

        <!-- Auth buttons bên phải -->
        <div class="auth-buttons">
            <button class="btn login">Login</button>
            <button class="btn register">Register</button>
        </div>

    </header>


    <!-- ================= PRODUCTS ================= -->
    <section class="products-section">

        <h2>Sản phẩm nổi bật</h2>

        <div class="products-container">

            <!-- CARD 1 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?1" alt="Product">
                
                <div class="product-info">
                    <h3>Tai nghe Gaming</h3>
                    <p class="price">799.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 2 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?2" alt="Product">
                
                <div class="product-info">
                    <h3>Bàn phím cơ RGB</h3>
                    <p class="price">1.290.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 3 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?3" alt="Product">
                
                <div class="product-info">
                    <h3>Chuột Wireless</h3>
                    <p class="price">450.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 4 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?4" alt="Product">
                
                <div class="product-info">
                    <h3>Màn hình 24 inch</h3>
                    <p class="price">3.490.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 5 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?5" alt="Product">
                
                <div class="product-info">
                    <h3>Laptop Gaming</h3>
                    <p class="price">24.990.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 6 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?6" alt="Product">
                
                <div class="product-info">
                    <h3>Loa Bluetooth</h3>
                    <p class="price">990.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 7 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?7" alt="Product">
                
                <div class="product-info">
                    <h3>Webcam Full HD</h3>
                    <p class="price">650.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <!-- CARD 8 -->
            <div class="product-card">
                <img src="https://picsum.photos/300/200?8" alt="Product">
                
                <div class="product-info">
                    <h3>Ghế công thái học</h3>
                    <p class="price">4.200.000đ</p>

                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

        </div>
    </section>

    
</body>
</html>
